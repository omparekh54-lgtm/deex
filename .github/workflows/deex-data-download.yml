name: DEEX ten-year data download

on:
  push:
    branches: [data/full-ten-year-download]
    paths: ['.github/workflows/deex-data-download.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deex-historical-acquisition
  cancel-in-progress: false

jobs:
  collect:
    name: Historical data ${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # One public-source collector at a time, including across calendar years.
      max-parallel: 1
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      DEEX_YEAR: ${{ matrix.year }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: run_data
          key: deex-data-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deex-data-v1-${{ matrix.year }}-
      - name: Install the pinned Finstack collector
        run: |
          python3 -m venv .collector-venv
          .collector-venv/bin/pip install -r requirements-data.txt -r requirements-finstack.txt
      - name: Acquire year and checkpoint before the runner time limit
        id: acquire
        continue-on-error: true
        run: |
          .collector-venv/bin/python scripts/run_full_download.py --root run_data --acquire-year "$DEEX_YEAR" --max-seconds 18000 --batch 10
      - name: Stage Finstack historical membership candidate
        if: always() && matrix.year == 2026
        timeout-minutes: 10
        continue-on-error: true
        run: .collector-venv/bin/python scripts/collect_local_data.py --root run_data finstack-reference --dataset membership
      - name: Stage Finstack historical shareholding candidate
        if: always() && matrix.year == 2026
        timeout-minutes: 10
        continue-on-error: true
        run: .collector-venv/bin/python scripts/collect_local_data.py --root run_data finstack-reference --dataset shareholding
      - name: Export register and verify the checkpoint
        if: always()
        run: |
          .collector-venv/bin/python scripts/collect_local_data.py --root run_data universe --out run_data/company_targets.csv
          .collector-venv/bin/python scripts/collect_local_data.py --root run_data verify
          .collector-venv/bin/python scripts/package_local_data.py --root run_data --out "deex-data-${DEEX_YEAR}.zip"
      - name: Save resumable data cache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: run_data
          key: deex-data-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload data and coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deex-data-${{ matrix.year }}
          path: |
            deex-data-${{ matrix.year }}.zip
            run_data/download_progress.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Report acquisition state
        if: always()
        run: |
          .collector-venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('run_data/download_progress.json')
          if not path.exists():
              raise SystemExit('No checkpoint was produced')
          report = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Acquisition state: ' + report['state'] + '\n\n')
              out.write('Backtest-ready: **false**. Downloaded/staged data is subject to coverage and point-in-time audit.\n\n')
              out.write('Rerun this workflow to resume pending tasks from saved year caches. Cache eviction may require restoring the downloaded year artifact locally.\n')
          if report['state'] in ('SOURCE_BLOCKED', 'CHECKPOINTED_ERROR', 'CHECKPOINTED_LIMIT'):
              raise SystemExit('Acquisition requires repair or another checkpointed pass; see the uploaded report')
          PY
